# Re-reads Saad's two Spotify playlists, matches new songs on YouTube and
# commits the updated song list. The push to main makes Vercel redeploy.
# Started from the site's terminal (`sudo sync-playlist`) or by hand from the
# Actions tab.
name: Sync playlists

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-playlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the script only uses Node built-ins, so no npm install needed
      - name: Sync playlists
        run: node scripts/sync-playlist.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data/playlist.json; then
            echo "Playlists unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playlist.json
          git commit -m "Sync playlists from Spotify"
          git push
